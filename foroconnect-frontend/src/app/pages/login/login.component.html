
<div class="login-container">
  <div class="login-card">

    <h1>ForoConnect</h1>
    <p>Conecta, comparte y participa</p>

    <h2>Iniciar sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label for="correo">Correo electrónico</label>

        <input
          type="email"
          id="correo"
          formControlName="correo"
          placeholder="ejemplo@correo.com"
        />

        <small
          *ngIf="loginForm.get('correo')?.touched &&
                 loginForm.get('correo')?.hasError('required')"
          class="error">
          El correo es obligatorio.
        </small>

        <small
          *ngIf="loginForm.get('correo')?.touched &&
                 loginForm.get('correo')?.hasError('email')"
          class="error">
          Ingresa un correo válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
        />

        <small
          *ngIf="loginForm.get('password')?.touched &&
                 loginForm.get('password')?.hasError('required')"
          class="error">
          La contraseña es obligatoria.
        </small>

        <small
          *ngIf="loginForm.get('password')?.touched &&
                 loginForm.get('password')?.hasError('minlength')"
          class="error">
          La contraseña debe tener al menos 8 caracteres.
        </small>
      </div>

      <button type="submit">Ingresar</button>

      <p class="error" *ngIf="mensaje">
        {{ mensaje }}
      </p>

    </form>

    <p class="register-link">
      ¿No tienes una cuenta?
      <a routerLink="/registro">Regístrate aquí</a>
    </p>

  </div>
</div>
