
<div class="recuperar-container">
  <div class="recuperar-card">

    <h1>ForoConnect</h1>
    <p>Conecta, comparte y participa</p>

    <h2>Recuperar contraseña</h2>

    <p class="descripcion">
      Ingresa tu correo electrónico para solicitar
      la recuperación de tu contraseña.
    </p>

    <form [formGroup]="recuperarForm"
          (ngSubmit)="recuperar()">

      <div class="form-group">
        <label for="correo">Correo electrónico</label>

        <input
          type="email"
          id="correo"
          formControlName="correo"
          placeholder="ejemplo@correo.com"
        />

        <small
          class="error"
          *ngIf="recuperarForm.get('correo')?.touched &&
                 recuperarForm.get('correo')?.hasError('required')">
          El correo electrónico es obligatorio.
        </small>

        <small
          class="error"
          *ngIf="recuperarForm.get('correo')?.touched &&
                 recuperarForm.get('correo')?.hasError('email')">
          Ingresa un correo electrónico válido.
        </small>
      </div>

      <button type="submit">
        Recuperar contraseña
      </button>

      <p
        *ngIf="mensaje"
        [class.exito]="enviado"
        [class.error]="!enviado">
        {{ mensaje }}
      </p>

    </form>

    <p class="login-link">
      ¿Recordaste tu contraseña?
      <a href="/login">Volver a iniciar sesión</a>
    </p>

  </div>
</div>
